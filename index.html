// 座席位置と写真を分離して管理。
// 全11席を同一サイズ（221×295px）で統一し、上下左右の間隔を均等に配置しています。
// 写真を入れ替えても、常に同じ座席領域に収まるようにします。
let seatMembers = items.map(x=>x.id);
// 下段左端を初期空席にし、空席も含めて座席を入れ替えられるようにします。
seatMembers.splice(6, 0, null);
let selectedSeatIndex = null;

function render(){
  stage.querySelectorAll('.person,.empty-seat').forEach(e=>e.remove());

  seatMembers.forEach((memberId, seatIndex)=>{
    const seat = seats[seatIndex];
    const item = memberId === null ? null : items.find(x=>x.id===memberId);
    const el = item ? document.createElement('img') : document.createElement('div');
    el.className = item ? 'person' : 'empty-seat';
    el.dataset.seatIndex = seatIndex;
    if(item){
      el.src=item.src;
      el.alt='メンバー写真';
      el.dataset.id=item.id;
    }else{
      el.setAttribute('aria-label','空席');
      el.title='空席';
    }
    el.style.left=seat.x+'%';
    el.style.top=seat.y+'%';
    el.style.width=seat.w+'%';
    el.style.height=seat.h+'%';

    el.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();

      if(selectedSeatIndex === null){
        selectedSeatIndex = seatIndex;
        if(item) el.classList.add('selected');
        status.textContent = item ? '1枚目を選択しました。次に交換したい写真または空席をタップしてください。' : '空席を選択しました。次に移動したい写真をタップしてください。';
        return;
      }

      if(selectedSeatIndex === seatIndex){
        selectedSeatIndex = null;
        render();
        status.textContent='選択を解除しました。';
        return;
      }

      [seatMembers[selectedSeatIndex], seatMembers[seatIndex]] = [seatMembers[seatIndex], seatMembers[selectedSeatIndex]];
      selectedSeatIndex = null;
      render();
      status.textContent='座席を入れ替えました。空席の位置も変更できます。';
    });

    stage.appendChild(el);
  });

  if(selectedSeatIndex !== null){
    const selected = stage.querySelector(`[data-seat-index="${selectedSeatIndex}"]`);
    if(selected && selected.classList.contains('person')) selected.classList.add('selected');
  }
}

render();

document.getElementById('reset').onclick=()=>{
  selectedSeatIndex = null;
  seatMembers = items.map(x=>x.id);
  seatMembers.splice(6, 0, null);
  render();
  status.textContent='元の配置に戻しました。下段左端は空席です。';
};

document.getElementById('save').onclick=async()=>{
  const canvas=document.createElement('canvas');
  canvas.width=1536; canvas.height=864;
  const ctx=canvas.getContext('2d');
  const bg=new Image(); bg.src=stage.style.backgroundImage.slice(5,-2);
  await new Promise(r=>bg.onload=r);
  ctx.drawImage(bg,0,0,1536,864);
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(245,242,223,.92)';
  ctx.font='400 25px "Comic Sans MS","Bradley Hand","Segoe Print","Hiragino Maru Gothic ProN",cursive';
  ctx.shadowColor='rgba(255,255,255,.5)'; ctx.shadowBlur=1;
  ctx.fillText('じゅーすじゅーす女学院　座席表（妄想）',768,87);
  ctx.restore();

  for(let seatIndex=0;seatIndex<seatMembers.length;seatIndex++){
    const memberId=seatMembers[seatIndex];
    if(memberId===null) continue;
    const item=items.find(x=>x.id===memberId);
    const seat=seats[seatIndex];
    const im=new Image(); im.src=item.src; await new Promise(r=>im.onload=r);
    ctx.drawImage(im,seat.x/100*1536,seat.y/100*864,seat.w/100*1536,seat.h/100*864);
  }
  const a=document.createElement('a'); a.download='じゅーすじゅーす女学院_座席表.png';
  a.href=canvas.toDataURL('image/png'); a.click();
  status.textContent='画像を保存しました。';
};

document.getElementById('share').onclick=async()=>{
  const canvas=document.createElement('canvas'); canvas.width=1536; canvas.height=864;
  const ctx=canvas.getContext('2d');
  const bg=new Image(); bg.src=stage.style.backgroundImage.slice(5,-2);
  await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=reject});
  ctx.drawImage(bg,0,0,1536,864);
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(245,242,223,.92)';
  ctx.font='400 25px "Comic Sans MS","Bradley Hand","Segoe Print","Hiragino Maru Gothic ProN",cursive';
  ctx.shadowColor='rgba(255,255,255,.5)'; ctx.shadowBlur=1;
  ctx.fillText('じゅーすじゅーす女学院　座席表（妄想）',768,87);
  ctx.restore();

  for(let seatIndex=0;seatIndex<seatMembers.length;seatIndex++){
    const memberId=seatMembers[seatIndex];
    if(memberId===null) continue;
    const item=items.find(x=>x.id===memberId);
    const seat=seats[seatIndex];
    const im=new Image(); im.src=item.src;
    await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject});
    ctx.drawImage(im,seat.x/100*1536,seat.y/100*864,seat.w/100*1536,seat.h/100*864);
  }
  canvas.toBlob(async blob=>{
    const file=new File([blob],'じゅーすじゅーす女学院_座席表.png',{type:'image/png'});
    const text=['#juicejuice','#じゅーすじゅーす女学院座席表','https://abara0807-star.github.io/juice-seating/'].join('\n');
    if(navigator.share){
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({text,files:[file]});
        else await navigator.share({text});
        status.textContent='共有しました。'; return;
      }catch(e){if(e.name==='AbortError')return;}
    }
    const a=document.createElement('a'); a.download=file.name; a.href=URL.createObjectURL(blob); a.click();
    try{await navigator.clipboard.writeText(text)}catch(e){}
    status.textContent='画像を保存し、投稿文をコピーしました。';
  },'image/png');
};
